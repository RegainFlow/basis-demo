name: Merge Gate

on:
  push:
    branches: [main, lr-codex-currency-review]
  pull_request:

permissions:
  contents: read

jobs:
  format-static:
    name: format-static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: astral-sh/setup-uv@v5
      - run: npm run install:python
      - run: npm run format:python
      - run: npm run lint:python
      - run: npm run semgrep

  tests:
    name: tests
    runs-on: ubuntu-latest
    needs: format-static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: npm run install:python
      - run: npm run test:python

  web:
    name: web
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build:web
