name: Merge Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  format-static:
    name: format-static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: astral-sh/setup-uv@v5
      - run: npm run install:python
      - run: npm run format:python
      - run: npm run lint:python
      - run: npm run semgrep

  architecture:
    name: architecture
    runs-on: ubuntu-latest
    needs: format-static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: astral-sh/setup-uv@v5
      - run: npm run install:python
      - run: npm run architecture

  tests-mutation:
    name: tests-mutation
    runs-on: ubuntu-latest
    needs: architecture
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: astral-sh/setup-uv@v5
      - run: npm run install:python
      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "${{ github.base_ref }}"
      - run: npm run test:python
      - run: npm run test:mutation

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: tests-mutation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm run install:python
      - run: npm ci
      - run: npm --workspace e2e exec -- playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e/test-results/**/*.png
          if-no-files-found: error
