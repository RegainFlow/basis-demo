name: Merge Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  format-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: astral-sh/setup-uv@v5
      - run: npm run install:python
      - run: npm run format:python
      - run: npm run lint:python
      - run: npm run semgrep

  architecture:
    runs-on: ubuntu-latest
    needs: format-static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: astral-sh/setup-uv@v5
      - run: npm run install:python
      - run: npm run architecture

  tests-mutation:
    runs-on: ubuntu-latest
    needs: architecture
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: astral-sh/setup-uv@v5
      - run: npm run install:python
      - run: npm run test:python
      - run: npm run test:mutation

  e2e:
    runs-on: ubuntu-latest
    needs: tests-mutation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm run install:python
      - run: npm ci
      - run: npm --workspace e2e exec -- playwright install --with-deps chromium
      - run: npm run e2e
