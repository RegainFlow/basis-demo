rules:
  - id: basis.web-no-direct-invoice-engine-import
    message: Web code must call the API package boundary, not invoice_engine directly.
    severity: ERROR
    languages: [javascript, typescript]
    paths:
      include:
        - packages/web/src/**
    patterns:
      - pattern-either:
          - pattern: import $X from "$MODULE"
          - pattern: import { $X } from "$MODULE"
          - pattern: import "$MODULE"
      - metavariable-regex:
          metavariable: $MODULE
          regex: .*invoice[-_]engine.*

  - id: basis.invoice-engine-no-float-conversion
    message: Money math must stay in Decimal; do not convert invoice values with float().
    severity: ERROR
    languages: [python]
    paths:
      include:
        - packages/invoice-engine/src/**
    pattern: float(...)

  - id: basis.invoice-engine-no-python-round
    message: Money math must use Decimal.quantize with ROUND_HALF_EVEN, not Python round().
    severity: ERROR
    languages: [python]
    paths:
      include:
        - packages/invoice-engine/src/**
    pattern: round(...)
