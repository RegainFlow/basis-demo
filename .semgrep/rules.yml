rules:
  - id: basis.web-no-direct-invoice-engine-import
    message: Web code must call the API package boundary, not invoice_engine directly.
    severity: ERROR
    languages: [javascript, typescript]
    paths:
      include:
        - packages/web/src/**
    patterns:
      - pattern-either:
          - pattern: import $X from "$MODULE"
          - pattern: import { $X } from "$MODULE"
          - pattern: import "$MODULE"
      - metavariable-regex:
          metavariable: $MODULE
          regex: .*invoice[-_]engine.*
