[project]
name = "basis-api"
version = "0.1.0"
description = "FastAPI invoice business-logic layer for the Basis demo."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "invoice-engine",
    "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
invoice-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
