[project]
name = "invoice-engine"
version = "0.1.0"
description = "Decimal-safe invoice math and simple expense categorization."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_engine"]
