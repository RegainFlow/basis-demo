[project]
name = "invoice-engine"
version = "0.1.0"
description = "Decimal-safe invoice math and simple expense categorization."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_engine"]

[tool.mutmut]
source_paths = ["src"]
also_copy = ["tests"]
do_not_mutate = ["*/__init__.py"]
mutate_only_covered_lines = true
pytest_add_cli_args = ["-q"]
pytest_add_cli_args_test_selection = [
    "tests/test_line_items.py",
]
